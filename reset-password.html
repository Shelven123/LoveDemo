<body>


<div class="card">

    <div class="logo">
        ❤️ LoveDemo
    </div>

    <div class="title">
        Reset Password
    </div>

    <div class="subtitle">
        Enter your new password below.
    </div>


    <label for="newPassword">
        New Password
    </label>

    <input
        id="newPassword"
        type="password"
        placeholder="Enter new password"
        autocomplete="new-password"
    >


    <label for="confirmPassword">
        Confirm Password
    </label>

    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        autocomplete="new-password"
    >


    <button
        id="resetButton"
        onclick="updatePassword()"
    >
        Update Password
    </button>


    <div
        id="message"
        class="message"
    ></div>

        <a href="login.html">
            Back to Login
        </a>

    </div>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   CHECK RECOVERY SESSION
========================= */

async function checkRecovery() {

    const message =
        document.getElementById("message");


    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .getSession();


    if (error) {

        console.error(error);

        message.textContent =
            "Invalid or expired reset link.";

        return;

    }


    if (!data.session) {

        message.textContent =
            "Invalid or expired reset link.";

        return;

    }


    message.textContent = "";

}


checkRecovery();



/* =========================
   UPDATE PASSWORD
========================= */

async function updatePassword() {

    const newPassword =
        document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("resetButton");


    if (!newPassword) {

        message.textContent =
            "Please enter a new password.";

        return;

    }


    if (newPassword.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    if (newPassword !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;

    }


    button.disabled = true;

    message.textContent =
        "Updating password...";


    try {

        const {
            error
        } =
        await supabaseClient
        .auth
        .updateUser({

            password: newPassword

        });


        if (error) {

            console.error(error);

            message.textContent =
                error.message;

            button.disabled = false;

            return;

        }


        message.textContent =
            "Password updated successfully!";


        setTimeout(
            async function() {

                await supabaseClient
                    .auth
                    .signOut();


                window.location.href =
                    "login.html";

            },
            1500
        );


    } catch (error) {

        console.error(error);

        message.textContent =
            "Something went wrong.";

        button.disabled = false;

    }

}

</script>
