<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LoveDemo Host Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            height: 65px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            font-size: 25px;
            cursor: pointer;
            margin-right: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .host-info {
            flex: 1;
        }

        .host-name {
            font-size: 16px;
            font-weight: bold;
        }

        .online {
            font-size: 12px;
            color: #22c55e;
            margin-top: 3px;
        }

        .earnings {
            background: #fff4cc;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #d97706;
        }

        .chat-area {
            padding: 15px;
            padding-bottom: 80px;
            min-height: calc(100vh - 65px);
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .mine {
            margin-left: auto;
            background: #ff4f81;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .theirs {
            margin-right: auto;
            background: white;
            color: #222;
            border-bottom-left-radius: 5px;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 100px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            padding: 10px;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 22px;
            padding: 11px 15px;
            outline: none;
            font-size: 15px;
        }

        .send-button {
            border: none;
            background: #ff4f81;
            color: white;
            border-radius: 22px;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

    </style>

</head>


<body>


    <div class="header">

        <div
            class="back"
            onclick="history.back()"
        >
            ‹
        </div>


        <img
            id="hostAvatar"
            class="avatar"
            src="https://i.pravatar.cc/200?img=47"
        >


        <div class="host-info">

            <div class="host-name">
                Amy
            </div>

            <div class="online">
                🟢 Online
            </div>

        </div>


        <div
            id="earnings"
            class="earnings"
        >
            💎 0
        </div>

    </div>


    <div
        id="chatArea"
        class="chat-area"
    >

        <div
            id="emptyMessage"
            class="empty"
        >
            No messages yet
        </div>

    </div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Reply to Vincent..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


<script>


    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "https://aodkljvskeuumrqesynm.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==============================
    // USERS
    // ==============================

    const currentUser =
        "Amy";


    const customer =
        "Vincent";


    // ==============================
    // DISPLAY MESSAGE
    // ==============================

    function displayMessage(message) {

        const chatArea =
            document.getElementById(
                "chatArea"
            );


        const empty =
            document.getElementById(
                "emptyMessage"
            );


        if (empty) {

            empty.remove();

        }


        const div =
            document.createElement(
                "div"
            );


        div.classList.add(
            "message"
        );


        if (
            message.sender ===
            currentUser
        ) {

            div.classList.add(
                "mine"
            );

        } else {

            div.classList.add(
                "theirs"
            );

        }


        div.textContent =
            message.message;


        chatArea.appendChild(
            div
        );


        chatArea.scrollTop =
            chatArea.scrollHeight;

    }


    // ==============================
    // LOAD OLD MESSAGES
    // ==============================

    async function loadMessages() {

        const { data, error } =
            await supabaseClient
            .from("Message")
            .select("*")
            .or(
                `and(sender.eq.${currentUser},receiver.eq.${customer}),and(sender.eq.${customer},receiver.eq.${currentUser})`
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Load messages error:",
                error
            );

            return;

        }


        data.forEach(
            function(message) {

                displayMessage(
                    message
                );

            }
        );

    }


    // ==============================
    // LOAD AMY DIAMONDS
    // ==============================

    async function loadEarnings() {

        const { data, error } =
            await supabaseClient
            .from("Profile")
            .select("diamonds")
            .ilike(
                "username",
                currentUser
            )
            .single();


        if (error) {

            console.error(
                "Load earnings error:",
                error
            );

            return;

        }


        updateEarnings(
            data.diamonds
        );

    }


    // ==============================
    // UPDATE EARNINGS
    // ==============================

    function updateEarnings(
        amount
    ) {

        document.getElementById(
            "earnings"
        ).textContent =
            "💎 " +
            Number(
                amount
            ).toLocaleString();

    }


    // ==============================
    // SEND REPLY
    // ==============================

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const button =
            document.getElementById(
                "sendButton"
            );


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        button.disabled = true;

        input.disabled = true;


        // ==========================
        // HOST REPLY
        // ==========================

        const { data, error } =
            await supabaseClient
            .from("Message")
            .insert({
                sender:
                    currentUser,

                receiver:
                    customer,

                message:
                    message
            });


        if (error) {

            console.error(
                "Send message error:",
                error
            );


            alert(
                "Message failed to send."
            );


            button.disabled = false;

            input.disabled = false;

            return;

        }


        input.value = "";


        button.disabled = false;

        input.disabled = false;

        input.focus();

    }


    // ==============================
    // REALTIME
    // ==============================

    const channel =
        supabaseClient
        .channel(
            "love-demo-host-chat"
        )
        .on(
            "postgres_changes",
            {
                event:
                    "INSERT",

                schema:
                    "public",

                table:
                    "Message"
            },

            function(payload) {

                const message =
                    payload.new;


                const isCurrentChat =
                    (
                        message.sender ===
                        currentUser &&
                        message.receiver ===
                        customer
                    )
                    ||
                    (
                        message.sender ===
                        customer &&
                        message.receiver ===
                        currentUser
                    );


                if (
                    isCurrentChat
                ) {

                    displayMessage(
                        message
                    );

                }


                // 当 Vincent 发消息时
                // 重新读取 Amy Diamond

                if (
                    message.sender ===
                    customer &&
                    message.receiver ===
                    currentUser
                ) {

                    loadEarnings();

                }

            }
        )
        .subscribe(
            function(status) {

                console.log(
                    "Host realtime status:",
                    status
                );

            }
        );


    // ==============================
    // ENTER KEY
    // ==============================

    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    sendMessage();

                }

            }
        );


    // ==============================
    // START
    // ==============================

    loadMessages();

    loadEarnings();


</script>


</body>

</html>
