```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LoveDemo Host Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
}


/* HEADER */

.header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #eee;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;
}

.left-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-button {
    border: none;
    background: #f5f5f5;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 18px;

    cursor: pointer;
}

.customer-name {
    font-size: 17px;
    font-weight: bold;
}

.online {
    font-size: 11px;
    color: #18a558;
    margin-top: 2px;
}

.balance {
    background: #fff3f7;
    color: #ff4f81;

    padding: 8px 12px;

    border-radius: 20px;

    font-size: 13px;
    font-weight: bold;
}


/* CHAT */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.loading {
    text-align: center;
    color: #999;
    padding: 30px;
}

.message-row {
    display: flex;
    margin-bottom: 12px;
}

.message-row.me {
    justify-content: flex-end;
}

.message-row.customer {
    justify-content: flex-start;
}

.message {
    max-width: 75%;

    padding: 10px 13px;

    border-radius: 16px;

    font-size: 14px;

    line-height: 1.4;

    word-break: break-word;
}

.message-row.me .message {
    background: #ff4f81;
    color: white;

    border-bottom-right-radius: 4px;
}

.message-row.customer .message {
    background: white;
    color: #333;

    border-bottom-left-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.05);
}

.time {
    font-size: 10px;
    color: #999;
    margin-top: 4px;
}


/* INPUT */

.input-area {
    background: white;

    border-top: 1px solid #eee;

    padding: 10px;

    display: flex;

    gap: 8px;
}

.message-input {
    flex: 1;

    border: 1px solid #ddd;

    border-radius: 20px;

    padding: 11px 14px;

    font-size: 14px;

    outline: none;
}

.message-input:focus {
    border-color: #ff4f81;
}

.send-button {
    border: none;

    background: #ff4f81;

    color: white;

    width: 48px;

    border-radius: 50%;

    font-size: 18px;

    cursor: pointer;
}

.send-button:disabled {
    background: #ccc;
}


/* INFO */

.host-info {
    text-align: center;

    font-size: 11px;

    color: #999;

    padding-bottom: 4px;
}


/* ERROR */

.error-box {
    margin: 20px 15px;

    background: #fff0f0;

    color: #c62828;

    padding: 15px;

    border-radius: 12px;

    font-size: 14px;

    line-height: 1.5;

    text-align: center;
}

</style>

</head>


<body>


<div class="header">

    <div class="left-header">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ←
        </button>

        <div>

            <div
                id="customerName"
                class="customer-name"
            >
                Finding customer...
            </div>

            <div class="online">
                🟢 Customer
            </div>

        </div>

    </div>


    <div
        id="balance"
        class="balance"
    >
        💎 Loading...
    </div>

</div>



<div
    id="chatArea"
    class="chat-area"
>

    <div class="loading">
        Finding latest conversation...
    </div>

</div>



<div class="host-info">
    Host replies are free
</div>


<div class="input-area">

    <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="Reply to customer..."
        autocomplete="off"
        disabled
        onkeydown="handleEnter(event)"
    >

    <button
        id="sendButton"
        class="send-button"
        onclick="sendMessage()"
        disabled
    >
        ➤
    </button>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let currentAuthUser = null;

let currentProfile = null;

let currentHost = null;

let currentCustomer = null;

let realtimeChannel = null;


/* =========================
   INIT
========================= */

async function init() {

    try {

        /*
         * Check login
         */

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if (
            error ||
            !data.user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        currentAuthUser =
            data.user;


        /*
         * Find Host Profile
         */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
        .from("Profile")
        .select("*")
        .eq(
            "auth_id",
            currentAuthUser.id
        )
        .single();


        if (
            profileError ||
            !profile
        ) {

            showError(
                "Host profile not found."
            );

            return;

        }


        /*
         * Make sure Host
         */

        if (
            profile.role !== "host"
        ) {

            showError(
                "This account is not a Host account."
            );

            return;

        }


        currentProfile =
            profile;


        currentHost =
            profile.username;


        updateBalance(
            profile.diamonds
        );


        /*
         * Find latest customer
         */

        await findLatestCustomer();


        /*
         * Start realtime
         */

        startRealtime();


    } catch (error) {

        console.error(error);

        showError(
            "Something went wrong."
        );

    }

}


/* =========================
   FIND LATEST CUSTOMER
========================= */

async function findLatestCustomer() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("Message")
    .select("*")
    .or(
        "sender.eq." +
        currentHost +
        ",receiver.eq." +
        currentHost
    )
    .order(
        "created_at",
        {
            ascending: false
        }
    )
    .limit(1);


    if (error) {

        console.error(error);

        showError(
            "Unable to find conversation."
        );

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        document.getElementById(
            "customerName"
        ).textContent =
            "No customer yet";

        document.getElementById(
            "chatArea"
        ).innerHTML =
            '<div class="loading">No messages yet.</div>';

        return;

    }


    const latestMessage =
        data[0];


    /*
     * Determine the other person
     */

    if (
        latestMessage.sender.toLowerCase() ===
        currentHost.toLowerCase()
    ) {

        currentCustomer =
            latestMessage.receiver;

    } else {

        currentCustomer =
            latestMessage.sender;

    }


    document.getElementById(
        "customerName"
    ).textContent =
        currentCustomer;


    enableInput();


    await loadMessages();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    if (!currentCustomer) {
        return;
    }


    const chatArea =
        document.getElementById(
            "chatArea"
        );


    const {
        data,
        error
    } =
    await supabaseClient
    .from("Message")
    .select("*")
    .order(
        "created_at",
        {
            ascending: true
        }
    );


    if (error) {

        console.error(error);

        chatArea.innerHTML =
            '<div class="loading">Unable to load messages.</div>';

        return;

    }


    chatArea.innerHTML = "";


    const messages =
        (data || []).filter(
            function(row) {

                return (

                    (
                        row.sender.toLowerCase() ===
                        currentHost.toLowerCase()

                        &&

                        row.receiver.toLowerCase() ===
                        currentCustomer.toLowerCase()
                    )

                    ||

                    (
                        row.sender.toLowerCase() ===
                        currentCustomer.toLowerCase()

                        &&

                        row.receiver.toLowerCase() ===
                        currentHost.toLowerCase()
                    )

                );

            }
        );


    if (messages.length === 0) {

        chatArea.innerHTML =
            '<div class="loading">No messages yet.</div>';

        return;

    }


    messages.forEach(
        function(row) {

            addMessageToScreen(
                row
            );

        }
    );


    scrollToBottom();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(
    row
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    const isMe =
        row.sender.toLowerCase() ===
        currentHost.toLowerCase();


    const rowDiv =
        document.createElement(
            "div"
        );


    rowDiv.className =
        "message-row " +
        (
            isMe
                ? "me"
                : "customer"
        );


    rowDiv.setAttribute(
        "data-message-id",
        row.id
    );


    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message";


    messageDiv.textContent =
        row.message;


    const timeDiv =
        document.createElement(
            "div"
        );


    timeDiv.className =
        "time";


    const date =
        new Date(
            row.created_at
        );


    timeDiv.textContent =
        date.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    messageDiv.appendChild(
        timeDiv
    );


    rowDiv.appendChild(
        messageDiv
    );


    chatArea.appendChild(
        rowDiv
    );

}


/* =========================
   REALTIME
========================= */

function startRealtime() {

    realtimeChannel =
        supabaseClient
        .channel(
            "host-auto-chat-" +
            currentHost
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "Message"
            },
            async function(payload) {

                const row =
                    payload.new;


                /*
                 * If this message is
                 * from the Host
                 */

                if (
                    row.sender.toLowerCase() ===
                    currentHost.toLowerCase()
                ) {

                    if (
                        !currentCustomer
                    ) {

                        currentCustomer =
                            row.receiver;

                        document.getElementById(
                            "customerName"
                        ).textContent =
                            currentCustomer;

                        enableInput();

                    }

                }


                /*
                 * If customer sends
                 * message to Host
                 */

                if (
                    row.receiver.toLowerCase() ===
                    currentHost.toLowerCase()
                ) {

                    /*
                     * If no customer selected,
                     * automatically select this user.
                     */

                    if (
                        !currentCustomer
                    ) {

                        currentCustomer =
                            row.sender;

                        document.getElementById(
                            "customerName"
                        ).textContent =
                            currentCustomer;

                        enableInput();

                        await loadMessages();

                        loadBalance();

                        return;

                    }


                    /*
                     * Ignore messages
                     * from other customers
                     */

                    if (
                        row.sender.toLowerCase() !==
                        currentCustomer.toLowerCase()
                    ) {

                        return;

                    }

                }


                /*
                 * Only display current conversation
                 */

                if (
                    !currentCustomer
                ) {

                    return;

                }


                const match =

                    (
                        row.sender.toLowerCase() ===
                        currentHost.toLowerCase()

                        &&

                        row.receiver.toLowerCase() ===
                        currentCustomer.toLowerCase()
                    )

                    ||

                    (
                        row.sender.toLowerCase() ===
                        currentCustomer.toLowerCase()

                        &&

                        row.receiver.toLowerCase() ===
                        currentHost.toLowerCase()
                    );


                if (!match) {
                    return;
                }


                const existing =
                    document.querySelector(
                        '[data-message-id="' +
                        row.id +
                        '"]'
                    );


                if (existing) {
                    return;
                }


                addMessageToScreen(
                    row
                );


                scrollToBottom();


                loadBalance();

            }
        )
        .subscribe();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (
        !currentHost ||
        !currentCustomer
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    button.disabled = true;


    const {
        error
    } =
    await supabaseClient
    .from("Message")
    .insert({

        sender:
            currentHost,

        receiver:
            currentCustomer,

        message:
            message

    });


    if (error) {

        console.error(error);

        alert(
            error.message
        );

        button.disabled = false;

        return;

    }


    input.value = "";

    button.disabled = false;

}


/* =========================
   ENABLE INPUT
========================= */

function enableInput() {

    document.getElementById(
        "messageInput"
    ).disabled = false;


    document.getElementById(
        "sendButton"
    ).disabled = false;

}


/* =========================
   BALANCE
========================= */

async function loadBalance() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("Profile")
    .select("diamonds")
    .eq(
        "auth_id",
        currentAuthUser.id
    )
    .single();


    if (
        !error &&
        data
    ) {

        updateBalance(
            data.diamonds
        );

    }

}


function updateBalance(
    diamonds
) {

    document.getElementById(
        "balance"
    ).textContent =
        "💎 " +
        Number(
            diamonds || 0
        ).toLocaleString();

}


/* =========================
   ERROR
========================= */

function showError(
    message
) {

    document.getElementById(
        "chatArea"
    ).innerHTML =

        '<div class="error-box">' +
        message +
        '<br><br>' +
        '<a href="login.html">Back to Login</a>' +
        '</div>';

}


/* =========================
   ENTER
========================= */

function handleEnter(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================
   START
========================= */

init();

</script>

</body>

</html>
```
