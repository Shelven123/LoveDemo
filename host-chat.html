<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LoveDemo Host Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
}

.header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #eee;

    display: flex;
    align-items: center;

    padding: 0 15px;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 10;
}

.host-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}

.host-info {
    margin-left: 10px;
}

.host-name {
    font-size: 17px;
    font-weight: bold;
}

.online {
    color: #22c55e;
    font-size: 12px;
    margin-top: 3px;
}

.chat {
    padding: 85px 15px 90px;
    max-width: 700px;
    margin: auto;
}

.message {
    max-width: 75%;
    padding: 11px 14px;
    border-radius: 18px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
}

.host-message {
    background: #ff4f81;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.user-message {
    background: white;
    color: #222;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

.time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    background: white;
    border-top: 1px solid #eee;

    padding: 10px;
}

.input-box {
    max-width: 700px;
    margin: auto;

    display: flex;
    gap: 8px;
}

.message-input {
    flex: 1;

    border: 1px solid #ddd;
    border-radius: 25px;

    padding: 12px 16px;

    outline: none;

    font-size: 15px;
}

.send {
    width: 50px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #ff4f81;
    color: white;

    font-size: 18px;

    cursor: pointer;
}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <img
        class="host-avatar"
        src="https://i.pravatar.cc/200?img=47"
    >

    <div class="host-info">

        <div class="host-name">

            Amy

        </div>

        <div class="online">

            🟢 Host Online

        </div>

    </div>

</div>


<!-- CHAT -->

<div
    id="chat"
    class="chat"
>
</div>


<!-- INPUT -->

<div class="input-area">

    <div class="input-box">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Reply to Vincent..."
        >

        <button
            id="sendButton"
            class="send"
        >

            ➤

        </button>

    </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

    );


/* =========================
   LOAD OLD MESSAGES
========================= */

async function loadMessages() {

    const { data, error } =
        await supabaseClient

        .from("Message")

        .select("*")

        .or(
            "and(sender.eq.Vincent,receiver.eq.Amy),and(sender.eq.Amy,receiver.eq.Vincent)"
        )

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Load messages error:",
            error
        );

        return;

    }


    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    data.forEach(
        displayMessage
    );

}


/* =========================
   DISPLAY MESSAGE
========================= */

function displayMessage(item) {

    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    if (
        item.sender ===
        "Amy"
    ) {

        div.className =
            "message host-message";

    }

    else {

        div.className =
            "message user-message";

    }


    const time =
        new Date(
            item.created_at
        ).toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    div.innerHTML = `

        ${escapeHtml(item.message)}

        <div class="time">

            ${time}

        </div>

    `;


    chat.appendChild(div);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) return;


    input.disabled = true;


    const { error } =
        await supabaseClient

        .from("Message")

        .insert({

            sender: "Amy",

            receiver: "Vincent",

            message: message

        });


    input.disabled = false;


    if (error) {

        console.error(
            "Send message error:",
            error
        );

        alert(
            "Message could not be sent."
        );

        return;

    }


    input.value = "";

}


/* =========================
   REALTIME
========================= */

const channel =
    supabaseClient

    .channel(
        "love-demo-host-chat"
    )

    .on(

        "postgres_changes",

        {

            event: "INSERT",

            schema: "public",

            table: "Message"

        },

        function(payload) {

            const message =
                payload.new;


            const isCurrentChat =

                (

                    message.sender ===
                    "Vincent" &&

                    message.receiver ===
                    "Amy"

                )

                ||

                (

                    message.sender ===
                    "Amy" &&

                    message.receiver ===
                    "Vincent"

                );


            if (
                isCurrentChat
            ) {

                displayMessage(
                    message
                );

            }

        }

    )

    .subscribe(
        function(status) {

            console.log(
                "Host realtime status:",
                status
            );

        }
    );


/* =========================
   ENTER TO SEND
========================= */

document.getElementById(
    "messageInput"
)
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================
   SEND BUTTON
========================= */

document.getElementById(
    "sendButton"
)
.addEventListener(
    "click",
    sendMessage
);


/* =========================
   START
========================= */

loadMessages();

</script>

</body>

</html>
