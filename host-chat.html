<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LoveDemo Host Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
}

.header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    padding: 0 15px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
}

.host-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}

.host-info {
    margin-left: 10px;
}

.host-name {
    font-size: 17px;
    font-weight: bold;
}

.online {
    color: #22c55e;
    font-size: 12px;
    margin-top: 3px;
}

.chat {
    padding: 85px 15px 90px;
    max-width: 700px;
    margin: auto;
}

.message {
    max-width: 75%;
    padding: 11px 14px;
    border-radius: 18px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.4;
}

.host-message {
    background: #ff4f81;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.user-message {
    background: white;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

.time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #eee;
    padding: 10px;
}

.input-box {
    max-width: 700px;
    margin: auto;
    display: flex;
    gap: 8px;
}

.message-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 12px 16px;
    outline: none;
    font-size: 15px;
}

.send {
    width: 50px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #ff4f81;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <img
        class="host-avatar"
        src="https://i.pravatar.cc/200?img=47"
    >

    <div class="host-info">

        <div class="host-name">

            Amy

        </div>

        <div class="online">

            🟢 Host Online

        </div>

    </div>

</div>


<!-- CHAT -->

<div
    class="chat"
    id="chat"
>
</div>


<!-- INPUT -->

<div class="input-area">

    <div class="input-box">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Reply to Vincent..."
        >

        <button
            class="send"
            onclick="sendMessage()"
        >

            ➤

        </button>

    </div>

</div>


<script>


/* SUPABASE */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


/* LOAD MESSAGES */

async function loadMessages() {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/Message" +

            "?or=(and(sender.eq.Vincent,receiver.eq.Amy),and(sender.eq.Amy,receiver.eq.Vincent))" +

            "&select=*" +

            "&order=created_at.asc",

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY

                }

            }

        );


        const messages =
            await response.json();


        const chat =
            document.getElementById("chat");


        chat.innerHTML = "";


        messages.forEach(function(item) {

            displayMessage(item);

        });

    }

    catch (error) {

        console.error(error);

    }

}


/* DISPLAY MESSAGE */

function displayMessage(item) {

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    if (item.sender === "Amy") {

        div.className =
            "message host-message";

    }

    else {

        div.className =
            "message user-message";

    }


    const time =
        new Date(item.created_at)
            .toLocaleTimeString([], {

                hour: "2-digit",

                minute: "2-digit"

            });


    div.innerHTML = `

        ${item.message}

        <div class="time">

            ${time}

        </div>

    `;


    chat.appendChild(div);


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/* SEND MESSAGE */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) return;


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/Message",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Prefer":
                        "return=minimal"

                },

                body: JSON.stringify({

                    sender: "Amy",

                    receiver: "Vincent",

                    message: message

                })

            }

        );


        if (!response.ok) {

            throw new Error(
                "Message could not be sent"
            );

        }


        input.value = "";

    }

    catch (error) {

        console.error(error);

        alert(
            "Message could not be sent."
        );

    }

}


/* REALTIME */

const channel =
    new WebSocket(

        "wss://aodkljvskeuumrqesynm.supabase.co/realtime/v1/websocket?apikey=" +
        encodeURIComponent(
            SUPABASE_KEY
        ) +
        "&vsn=1.0.0"

    );


channel.onopen = function() {

    console.log(
        "Host realtime connected"
    );


    channel.send(

        JSON.stringify({

            topic:
                "realtime:public:Message",

            event:
                "phx_join",

            payload: {

                config: {

                    broadcast: {

                        self: false

                    },

                    presence: {

                        key: ""

                    },

                    postgres_changes: [

                        {

                            event:
                                "INSERT",

                            schema:
                                "public",

                            table:
                                "Message"

                        }

                    ]

                }

            },

            ref:
                "1"

        })

    );

};


channel.onmessage = function(event) {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            data.event ===
            "postgres_changes"
        ) {

            const record =
                data.payload.record;


            if (

                (

                    record.sender ===
                    "Vincent" &&

                    record.receiver ===
                    "Amy"

                )

                ||

                (

                    record.sender ===
                    "Amy" &&

                    record.receiver ===
                    "Vincent"

                )

            ) {

                displayMessage(
                    record
                );

            }

        }

    }

    catch (error) {

        console.error(
            error
        );

    }

};


/* LOAD OLD MESSAGES */

loadMessages();


/* ENTER TO SEND */

document.getElementById(
    "messageInput"
)
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


</script>

</body>

</html>
