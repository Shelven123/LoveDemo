<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LoveDemo Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            height: 65px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            font-size: 25px;
            cursor: pointer;
            margin-right: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .host-info {
            flex: 1;
        }

        .host-name {
            font-size: 16px;
            font-weight: bold;
        }

        .online {
            font-size: 12px;
            color: #22c55e;
            margin-top: 3px;
        }

        .diamonds {
            background: #fff4cc;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #d97706;
        }

        .chat-area {
            padding: 15px;
            padding-bottom: 90px;
            min-height: calc(100vh - 65px);
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .mine {
            margin-left: auto;
            background: #ff4f81;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .theirs {
            margin-right: auto;
            background: white;
            color: #222;
            border-bottom-left-radius: 5px;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 100px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            padding: 10px;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 22px;
            padding: 11px 15px;
            outline: none;
            font-size: 15px;
        }

        .send-button {
            border: none;
            background: #ff4f81;
            color: white;
            border-radius: 22px;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .cost {
            position: absolute;
            bottom: 58px;
            right: 15px;
            font-size: 11px;
            color: #999;
        }

    </style>

</head>


<body>


    <div class="header">

        <div
            class="back"
            onclick="history.back()"
        >
            ‹
        </div>


        <img
            id="hostAvatar"
            class="avatar"
            src="https://i.pravatar.cc/200?img=47"
        >


        <div class="host-info">

            <div
                id="hostName"
                class="host-name"
            >
                Amy
            </div>

            <div class="online">
                🟢 Online
            </div>

        </div>


        <div
            id="diamondBalance"
            class="diamonds"
        >
            💎 0
        </div>

    </div>


    <div
        id="chatArea"
        class="chat-area"
    >

        <div
            id="emptyMessage"
            class="empty"
        >
            No messages yet
        </div>

    </div>


    <div class="cost">
        Each message costs 💎 10
    </div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


<script>


    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "https://aodkljvskeuumrqesynm.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==============================
    // CURRENT USER / HOST
    // ==============================

    const currentUser =
        "Vincent";


    const params =
        new URLSearchParams(
            window.location.search
        );


    const currentHost =
        params.get("name") || "Amy";


    const avatar =
        params.get("avatar");


    document.getElementById("hostName").textContent =
        currentHost;


    if (avatar) {

        document.getElementById("hostAvatar").src =
            avatar;

    }


    // ==============================
    // DISPLAY MESSAGE
    // ==============================

    function displayMessage(message) {

        const chatArea =
            document.getElementById("chatArea");


        const empty =
            document.getElementById("emptyMessage");


        if (empty) {

            empty.remove();

        }


        const div =
            document.createElement("div");


        div.classList.add("message");


        if (message.sender === currentUser) {

            div.classList.add("mine");

        } else {

            div.classList.add("theirs");

        }


        div.textContent =
            message.message;


        chatArea.appendChild(div);


        chatArea.scrollTop =
            chatArea.scrollHeight;

    }


    // ==============================
    // LOAD OLD MESSAGES
    // ==============================

    async function loadMessages() {

        const { data, error } =
            await supabaseClient
            .from("Message")
            .select("*")
            .or(
                `and(sender.eq.${currentUser},receiver.eq.${currentHost}),and(sender.eq.${currentHost},receiver.eq.${currentUser})`
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Load messages error:",
                error
            );

            return;

        }


        data.forEach(
            function(message) {

                displayMessage(message);

            }
        );

    }


    // ==============================
    // LOAD DIAMOND BALANCE
    // ==============================

    async function loadDiamonds() {

        const { data, error } =
            await supabaseClient
            .from("Profile")
            .select("diamonds")
            .ilike(
                "username",
                currentUser
            )
            .single();


        if (error) {

            console.error(
                "Diamond load error:",
                error
            );

            return;

        }


        updateDiamondDisplay(
            data.diamonds
        );

    }


    // ==============================
    // UPDATE DIAMOND DISPLAY
    // ==============================

    function updateDiamondDisplay(
        amount
    ) {

        document.getElementById(
            "diamondBalance"
        ).textContent =
            "💎 " +
            Number(amount).toLocaleString();

    }


    // ==============================
    // SEND MESSAGE
    // ==============================

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const button =
            document.getElementById(
                "sendButton"
            );


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        button.disabled = true;


        input.disabled = true;


        // ==========================
        // DIAMOND RPC
        // ==========================

        const { data, error } =
            await supabaseClient
            .rpc(
                "send_chat_message",
                {
                    p_sender:
                        currentUser,

                    p_receiver:
                        currentHost,

                    p_message:
                        message
                }
            );


        if (error) {

            console.error(
                "Send message error:",
                error
            );

            alert(
                "Message failed to send."
            );


            button.disabled = false;

            input.disabled = false;

            return;

        }


        console.log(
            "Diamond result:",
            data
        );


        // ==========================
        // CHECK RESULT
        // ==========================

        if (
            !data ||
            data.success !== true
        ) {

            if (
                data &&
                data.error ===
                "Not enough diamonds"
            ) {

                alert(
                    "Not enough diamonds 💎"
                );

            } else {

                alert(
                    data?.error ||
                    "Message failed to send."
                );

            }


            button.disabled = false;

            input.disabled = false;

            return;

        }


        // ==========================
        // SUCCESS
        // ==========================

        input.value = "";


        // Reload balance

        await loadDiamonds();


        button.disabled = false;

        input.disabled = false;


        input.focus();

    }


    // ==============================
    // REALTIME
    // ==============================

    const channel =
        supabaseClient
        .channel(
            "love-demo-chat"
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",

                schema: "public",

                table: "Message"
            },

            function(payload) {

                const message =
                    payload.new;


                const isCurrentChat =
                    (
                        message.sender ===
                        currentUser &&
                        message.receiver ===
                        currentHost
                    )
                    ||
                    (
                        message.sender ===
                        currentHost &&
                        message.receiver ===
                        currentUser
                    );


                if (
                    isCurrentChat
                ) {

                    displayMessage(
                        message
                    );

                }

            }
        )
        .subscribe(
            function(status) {

                console.log(
                    "Realtime status:",
                    status
                );

            }
        );


    // ==============================
    // ENTER KEY
    // ==============================

    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    sendMessage();

                }

            }
        );


    // ==============================
    // START
    // ==============================

    loadMessages();

    loadDiamonds();


</script>


</body>

</html>
