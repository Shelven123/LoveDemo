```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LoveDemo Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

    height: 100vh;

    display: flex;

    flex-direction: column;

}


/* =========================
   HEADER
========================= */

.header {

    height: 65px;

    background: white;

    border-bottom: 1px solid #eee;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

}

.left-header {

    display: flex;

    align-items: center;

    gap: 10px;

}

.back-button {

    border: none;

    background: #f5f5f5;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    font-size: 18px;

    cursor: pointer;

}

.host-name {

    font-size: 17px;

    font-weight: bold;

}

.online {

    font-size: 11px;

    color: #18a558;

    margin-top: 2px;

}

.balance {

    background: #fff3f7;

    color: #ff4f81;

    padding: 8px 12px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: bold;

}


/* =========================
   CHAT AREA
========================= */

.chat-area {

    flex: 1;

    overflow-y: auto;

    padding: 15px;

}

.loading {

    text-align: center;

    color: #999;

    padding: 30px;

}

.message-row {

    display: flex;

    margin-bottom: 12px;

}

.message-row.me {

    justify-content: flex-end;

}

.message-row.host {

    justify-content: flex-start;

}

.message {

    max-width: 75%;

    padding: 10px 13px;

    border-radius: 16px;

    line-height: 1.4;

    word-break: break-word;

}

.message-row.me .message {

    background: #ff4f81;

    color: white;

    border-bottom-right-radius: 4px;

}

.message-row.host .message {

    background: white;

    color: #333;

    border-bottom-left-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.05);

}

.time {

    font-size: 10px;

    color: #999;

    margin-top: 4px;

}


/* =========================
   INPUT

.input-area {

    background: white;

    border-top: 1px solid #eee;

    padding: 10px;

    display: flex;

    gap: 8px;

}

.message-input {

    flex: 1;

    border: 1px solid #ddd;

    border-radius: 20px;

    border-color: #ff4f81;

}

}

    background: #ccc;

    cursor: not-allowed;

}


/* =========================
   COST
========================= */

.cost {

    text-align: center;

    font-size: 11px;

    color: #999;

    padding-bottom: 4px;

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="left-header">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ←
        </button>


        <div>

            <div
                id="hostName"
                class="host-name"
            >
                Loading...
            </div>

            <div class="online">
                🟢 Online
            </div>

        </div>

    </div>


    <div
        id="balance"
        class="balance"
    >
        💎 Loading...
    </div>

</div>



<!-- =========================
     CHAT
========================= -->

<div
    id="chatArea"
    class="chat-area"
>

    <div class="loading">
        Loading messages...
    </div>

</div>



<!-- =========================
     INPUT
========================= -->

<div class="cost">
    💎 10 Diamonds per message
</div>


<div class="input-area">

    <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        onkeydown="handleEnter(event)"
    >


    <button
        id="sendButton"
        class="send-button"
        onclick="sendMessage()"
    >
        ➤
    </button>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let currentAuthUser = null;

let currentProfile = null;

let currentUser = null;

let currentHost = null;

const messageCost = 10;


/* =========================
   GET HOST
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


currentHost =
    params.get("name") || "Amy";


document.getElementById(
    "hostName"
).textContent =
    currentHost;


/* =========================
   INIT
========================= */

async function init() {

    try {

        /*
         * Get logged-in
         * Supabase Auth user
         */

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if (error || !data.user) {

            window.location.href =
                "login.html";

            return;

        }


        currentAuthUser =
            data.user;


        /*
         * Get Profile
         */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
        .from("Profile")
        .select("*")
        .eq(
            "auth_id",
            currentAuthUser.id
        )
        .single();


        if (profileError || !profile) {

            console.error(
                profileError
            );

            alert(
                "Profile not found."
            );

            return;

        }


        currentProfile =
            profile;


        currentUser =
            profile.username;


        /*
         * Show balance
         */

        updateBalance(
            profile.diamonds
        );


        /*
         * Load messages
         */

        await loadMessages();


        /*
         * Start realtime
         */

        startRealtime();


    } catch (error) {

        console.error(error);

    }

}


/* =========================
   BALANCE
========================= */

function updateBalance(
    diamonds
) {

    document.getElementById(
        "balance"
    ).textContent =
        "💎 " +
        Number(
            diamonds || 0
        ).toLocaleString();

}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance() {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("Profile")
    .select("diamonds")
    .eq(
        "auth_id",
        currentAuthUser.id
    )
    .single();


    if (!error && data) {

        updateBalance(
            data.diamonds
        );

    }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    const {
        data,
        error
    } =
    await supabaseClient
    .from("Message")
    .select("*")
    .or(
        "and(sender.eq." +
        encodeURIComponent(currentUser) +
        ",receiver.eq." +
        encodeURIComponent(currentHost) +
        "),and(sender.eq." +
        encodeURIComponent(currentHost) +
        ",receiver.eq." +
        encodeURIComponent(currentUser) +
        ")"
    )
    .order(
        "created_at",
        {
            ascending: true
        }
    );


    if (error) {

        console.error(error);

        chatArea.innerHTML =
            '<div class="loading">Unable to load messages.</div>';

        return;

    }


    chatArea.innerHTML = "";


    if (!data || data.length === 0) {

        chatArea.innerHTML =
            '<div class="loading">Start a conversation ❤️</div>';

        return;

    }


    data.forEach(function(row) {

        addMessageToScreen(
            row
        );

    });


    scrollToBottom();

}


/* =========================
   DISPLAY MESSAGE
========================= */

function addMessageToScreen(
    row
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    const isMe =
        row.sender.toLowerCase() ===
        currentUser.toLowerCase();


    const rowDiv =
        document.createElement("div");


    rowDiv.className =
        "message-row " +
        (isMe ? "me" : "host");


    const messageDiv =
        document.createElement("div");


    messageDiv.className =
        "message";


    messageDiv.textContent =
        row.message;


    const timeDiv =
        document.createElement("div");


    timeDiv.className =
        "time";


    const date =
        new Date(
            row.created_at
        );


    timeDiv.textContent =
        date.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    messageDiv.appendChild(
        timeDiv
    );


    rowDiv.appendChild(
        messageDiv
    );


    chatArea.appendChild(
        rowDiv
    );

}


/* =========================
   REALTIME
========================= */

function startRealtime() {

    supabaseClient
        .channel(
            "chat-" +
            currentUser +
            "-" +
            currentHost
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "Message"
            },
            function(payload) {

                const row =
                    payload.new;


                const match =

                    (
                        row.sender
                            .toLowerCase() ===
                        currentUser.toLowerCase()

                        &&
                        row.receiver
                            .toLowerCase() ===
                        currentHost.toLowerCase()
                    )

                    ||

                    (
                        row.sender
                            .toLowerCase() ===
                        currentHost.toLowerCase()

                        &&
                        row.receiver
                            .toLowerCase() ===
                        currentUser.toLowerCase()
                    );


                if (!match) {
                    return;
                }


                /*
                 * Avoid duplicate display
                 * for messages we already added
                 */

                const existing =
                    document.querySelector(
                        '[data-message-id="' +
                        row.id +
                        '"]'
                    );


                if (existing) {
                    return;
                }


                addMessageToScreen(
                    row
                );


                scrollToBottom();


                loadBalance();

            }
        )
        .subscribe();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }


    button.disabled = true;


    try {

        /*
         * Use existing RPC
         *
         * send_chat_message
         */

        const {
            data,
            error
        } =
        await supabaseClient
        .rpc(
            "send_chat_message",
            {
                p_sender:
                    currentUser,

                p_receiver:
                    currentHost,

                p_message:
                    message
            }
        );


        if (error) {

            console.error(error);

            alert(
                error.message
            );

            button.disabled = false;

            return;

        }


        /*
         * RPC returns:
         *
         * success: true
         * cost: 10
         */

        if (!data || data.success !== true) {

            alert(
                data?.error ||
                "Unable to send message."
            );

            button.disabled = false;

            return;

        }


        /*
         * Clear input
         */

        input.value = "";


        /*
         * Refresh balance
         */

        await loadBalance();


    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong."
        );

    }


    button.disabled = false;

}


/* =========================
   ENTER
========================= */

function handleEnter(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );


    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================
   START
========================= */

init();

</script>


</body>

</html>
