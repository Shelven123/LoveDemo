<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LoveDemo Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
}


/* HEADER */

.header {

    height: 65px;

    background: white;

    border-bottom: 1px solid #eee;

    display: flex;

    align-items: center;

    padding: 0 15px;

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    z-index: 10;

}


.back {

    font-size: 25px;

    border: none;

    background: none;

    cursor: pointer;

}


.host {

    display: flex;

    align-items: center;

    margin-left: 10px;

}


.host-avatar {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    object-fit: cover;

}


.host-info {

    margin-left: 10px;

}


.host-name {

    font-size: 17px;

    font-weight: bold;

}


.online {

    color: #22c55e;

    font-size: 12px;

    margin-top: 3px;

}


/* CHAT */

.chat {

    padding: 85px 15px 90px;

    max-width: 700px;

    margin: auto;

}


.message {

    max-width: 75%;

    padding: 11px 14px;

    border-radius: 18px;

    margin-bottom: 12px;

    font-size: 15px;

    line-height: 1.4;

}


.host-message {

    background: white;

    border-bottom-left-radius: 5px;

}


.user-message {

    background: #ff4f81;

    color: white;

    margin-left: auto;

    border-bottom-right-radius: 5px;

}


.time {

    font-size: 10px;

    opacity: 0.6;

    margin-top: 4px;

}


/* INPUT */

.input-area {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: white;

    border-top: 1px solid #eee;

    padding: 10px;

}


.input-box {

    max-width: 700px;

    margin: auto;

    display: flex;

    gap: 8px;

}


.message-input {

    flex: 1;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 12px 16px;

    outline: none;

    font-size: 15px;

}


.send {

    width: 50px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: #ff4f81;

    color: white;

    font-size: 18px;

    cursor: pointer;

}


</style>

</head>


<body>


<!-- HEADER -->

<div class="header">


    <button
        class="back"
        onclick="goBack()"
    >

        ←

    </button>


    <div class="host">

        <img
            id="hostAvatar"
            class="host-avatar"
            src="https://i.pravatar.cc/200?img=47"
        >


        <div class="host-info">

            <div
                id="hostName"
                class="host-name"
            >

                Amy

            </div>


            <div class="online">

                🟢 Online

            </div>

        </div>

    </div>

</div>



<!-- CHAT -->

<div
    class="chat"
    id="chat"
>


    <div class="message host-message">

        Hey! Nice to meet you ❤️

        <div class="time">

            Now

        </div>

    </div>


    <div class="message user-message">

        Hello Amy 👋

        <div class="time">

            Now

        </div>

    </div>


    <div class="message host-message">

        How are you today? 😊

        <div class="time">

            Now

        </div>

    </div>


</div>



<!-- INPUT -->

<div class="input-area">

    <div class="input-box">


        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Type a message..."
        >


        <button
            class="send"
            onclick="sendMessage()"
        >

            ➤

        </button>


    </div>

</div>



<script>


/* GET HOST DATA */

const params =
    new URLSearchParams(
        window.location.search
    );


const hostName =
    params.get("name") || "Amy";


const hostAvatar =
    params.get("avatar");


/* SHOW HOST */

document.getElementById("hostName")
    .textContent = hostName;


if (hostAvatar) {

    document.getElementById("hostAvatar")
        .src = hostAvatar;

}


/* BACK */

function goBack() {

    window.location.href =
        "index.html";

}


/* SEND MESSAGE */

async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (!message) return;


    const hostId =
        params.get("id");


    const hostName =
        params.get("name") || "Amy";


    try {

        const response = await fetch(

            "https://aodkljvskeuumrqesynm.supabase.co/rest/v1/Message",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A",

                    "Authorization":
                        "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A",

                    "Prefer":
                        "return=minimal"

                },

                body: JSON.stringify({

                    sender: "Vincent",

                    receiver: hostName,

                    message: message

                })

            }

        );


        if (!response.ok) {

            throw new Error(
                "Message could not be saved"
            );

        }


        const chat =
            document.getElementById("chat");


        const div =
            document.createElement("div");


        div.className =
            "message user-message";


        div.innerHTML = `

            ${message}

            <div class="time">

                Now

            </div>

        `;


        chat.appendChild(div);


        input.value = "";


        window.scrollTo({

            top: document.body.scrollHeight,

            behavior: "smooth"

        });


    } catch (error) {

        console.error(error);

        alert(
            "Message could not be sent."
        );

    }

}


/* ENTER TO SEND */

document.getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
