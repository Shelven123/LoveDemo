<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LoveDemo Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ff4f81;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff4f81;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #ff4f81;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:disabled {
            background: #ccc;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #ff4f81;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="logo">
        ❤️ LoveDemo
    </div>


    <div class="subtitle">
        Welcome back
    </div>


    <label>
        Email
    </label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    >


    <label>
        Password
    </label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >


    <button
        id="loginButton"
        class="login-button"
        onclick="login()"
    >
        Login
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


</div>


<script>


    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "https://aodkljvskeuumrqesynm.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==============================
    // LOGIN
    // ==============================

    async function login() {

        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const message =
            document
            .getElementById("message");


        const button =
            document
            .getElementById("loginButton");


        if (!email) {

            message.textContent =
                "Please enter your email.";

            return;

        }


        if (!password) {

            message.textContent =
                "Please enter your password.";

            return;

        }


        button.disabled = true;


        message.textContent =
            "Logging in...";


        // ==========================
        // SUPABASE LOGIN
        // ==========================

        const {
            data,
            error
        } =
            await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


        if (error) {

            console.error(error);


            message.textContent =
                error.message;


            button.disabled = false;

            return;

        }


        if (!data.user) {

            message.textContent =
                "Login failed.";

            button.disabled = false;

            return;

        }


        message.textContent =
            "Login successful!";


        // ==========================
        // GO HOME
        // ==========================

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            800
        );

    }


</script>


</body>

</html>
