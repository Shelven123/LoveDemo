<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveDemo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff4f81;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #ffd6e3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: auto;
        }

        .name {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        .bio {
            text-align: center;
            color: #666;
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff4f81;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e63e6d;
        }
    </style>
</head>

<body>

<header>
    ❤️ LoveDemo
</header>

<div class="container">

    <div class="title">
        Discover Hosts
    </div>

    <div id="hosts">
        Loading hosts...
    </div>

</div>

<script>
    const SUPABASE_URL = "https://aodkljvskeuumrqesynm.supabase.co";

    const SUPABASE_KEY = "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";

    async function loadHosts() {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/Profile?role=eq.host&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        const hosts = await response.json();

        const container = document.getElementById("hosts");

        container.innerHTML = "";

        hosts.forEach(host => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <div class="avatar">
                    👩
                </div>

                <div class="name">
                    ${host.username}
                </div>

                <div class="bio">
                    ${host.bio || ""}
                </div>

                <button onclick="openHost('${host.username}')">
                    Chat with ${host.username}
                </button>
            `;

            container.appendChild(card);
        });
    }

    function openHost(name) {
        alert("You selected " + name + " ❤️");
    }

    loadHosts();
</script>

</body>
</html>
