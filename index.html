</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://aodkljvskeuumrqesynm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_eOzqloWgTbe9CZmNS535hA_25llrr0A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let currentProfile = null;

let allHosts = [];


/* =========================
   START
========================= */

async function init() {

    try {

        /*
         * Get currently logged-in
         * Supabase Auth user
         */

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if (error || !data.user) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser = data.user;


        /*
         * Find Profile belonging
         * to this Auth account
         */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
        .from("Profile")
        .select("*")
        .eq("auth_id", currentUser.id)
        .single();


        if (profileError) {

            console.error(profileError);

            document.getElementById(
                "userName"
            ).textContent =
                currentUser.email;


            document.getElementById(
                "userEmail"
            ).textContent =
                currentUser.email;


        } else {

            currentProfile = profile;


            document.getElementById(
                "userName"
            ).textContent =
                profile.username;


            document.getElementById(
                "userEmail"
            ).textContent =
                currentUser.email;


            updateBalance(
                profile.diamonds
            );

        }


        /*
         * Load hosts
         */

        await loadHosts();


    } catch (error) {

        console.error(error);

    }

}


/* =========================
   BALANCE
========================= */

function updateBalance(
    diamonds
) {

    document.getElementById(
        "balance"
    ).textContent =
        "💎 " +
        Number(diamonds || 0).toLocaleString();

}


/* =========================
   LOAD HOSTS
========================= */

async function loadHosts() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("Profile")
    .select("*")
    .eq("role", "host")
    .order("created_at", {
        ascending: false
    });


    const grid =
        document.getElementById(
            "hostGrid"
        );


    if (error) {

        console.error(error);

        grid.innerHTML =
            '<div class="loading">Unable to load hosts.</div>';

        return;

    }


    allHosts = data || [];

    renderHosts(allHosts);

}


/* =========================
   RENDER HOSTS
========================= */

function renderHosts(
    hosts
) {

    const grid =
        document.getElementById(
            "hostGrid"
        );


    if (!hosts.length) {

        grid.innerHTML =
            '<div class="loading">No hosts found.</div>';

        return;

    }


    grid.innerHTML = "";


    hosts.forEach(function(host) {

        const avatar =
            host.avatar_url ||
            "https://i.pravatar.cc/500?img=47";


        const card =
            document.createElement("div");


        card.className =
            "host-card";


        card.innerHTML = `

            <img
                class="host-avatar"
                src="${avatar}"
                alt="${host.username}"
            >

            <div class="host-content">

                <div class="host-name">
                    ${host.username}
                </div>

                <div class="online">
                    🟢 Online
                </div>

                <div class="host-bio">
                    ${host.bio || "Nice to meet you ❤️"}
                </div>

                <button
                    class="chat-button"
                    onclick="openHost('${host.username}')"
                >
                    💬 Chat
                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================
   SEARCH
========================= */

function filterHosts() {

    const keyword =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        allHosts.filter(function(host) {

            const username =
                (
                    host.username || ""
                ).toLowerCase();


            const bio =
                (
                    host.bio || ""
                ).toLowerCase();


            return (
                username.includes(keyword) ||
                bio.includes(keyword)
            );

        });


    renderHosts(filtered);

}


/* =========================
   OPEN HOST
========================= */

function openHost(
    hostName
) {

    window.location.href =
        "chat.html?name=" +
        encodeURIComponent(hostName);

}


/* =========================
   NAVIGATION
========================= */

function goHome() {

    window.location.href =
        "index.html";

}


function goChats() {

    alert(
        "Chats page will be added later."
    );

}


function goWallet() {

    window.location.href =
        "wallet.html";

}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "login.html";

}


/* =========================
   START APP
========================= */

init();

</script>


</body>

</html>
